<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Notes Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f8fc;--card:#fff;--ink:#0b1b3a;--mut:#5b6b8a;--ac:#2f5bff;--ac2:#6a8bff;--bd:#e3e8f2;--ok:#16a34a;--bad:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a1226;--card:#111c38;--ink:#eaf0ff;--mut:#9fb0d3;--bd:#22305a}}
:root[data-theme=dark]{--bg:#0a1226;--card:#111c38;--ink:#eaf0ff;--mut:#9fb0d3;--bd:#22305a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Plus Jakarta Sans',Inter,system-ui,-apple-system,Segoe UI,sans-serif}
a{color:inherit;text-decoration:none}.w{max-width:1120px;margin:auto;padding:0 20px}
nav{background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.nb{display:flex;align-items:center;gap:18px;height:64px}.logo{display:flex;gap:8px;align-items:center;font-weight:800;font-size:19px}
.lk{display:flex;gap:16px;margin-left:auto;align-items:center}.lk a{color:var(--mut);font-size:15px}.lk a:hover{color:var(--ink)}
#ham{display:none;margin-left:auto;background:none;border:1px solid var(--bd);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:18px}
@media(max-width:820px){#ham{display:block}.lk{display:none;position:absolute;top:64px;left:0;right:0;background:var(--card);flex-direction:column;align-items:flex-start;padding:16px 20px;border-bottom:1px solid var(--bd)}.lk.o{display:flex}}
.btn{display:inline-block;border:0;border-radius:10px;padding:10px 16px;font:600 14px inherit;background:var(--ac);color:#fff;cursor:pointer}.btn:hover{background:var(--ac2)}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--bd)}.btn.s{padding:6px 11px;font-size:13px}.btn.r{background:var(--bad)}.btn.k{background:var(--ok)}
.hero{background:linear-gradient(135deg,#0b1b3a,#1e3a8a 60%,#2f5bff);color:#fff;padding:64px 0}.hero .w{display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:center}
@media(max-width:820px){.hero .w{grid-template-columns:1fr}}h1{font-size:clamp(30px,5vw,48px);line-height:1.1;margin:0 0 14px}
.hero p{color:#cfd9ff;max-width:520px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:-28px}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}}
.stat,.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;box-shadow:0 6px 20px rgba(11,27,58,.06)}
.stat b{font-size:26px;display:block}.stat span{color:var(--mut);font-size:14px}
h2{font-size:26px;margin:44px 0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:rgba(47,91,255,.12);color:var(--ac);margin:0 4px 4px 0}
.tag.demo{background:rgba(245,158,11,.15);color:#b45309}.tag.Pending{background:rgba(245,158,11,.15);color:#b45309}.tag.Approved{background:rgba(22,163,74,.15);color:var(--ok)}.tag.Rejected{background:rgba(220,38,38,.15);color:var(--bad)}
.card h3{margin:6px 0;font-size:17px}.m{color:var(--mut);font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.big{font-size:18px;padding:14px 16px}.fl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
label{font-size:13px;color:var(--mut);font-weight:600;display:block;margin:10px 0 4px}.form{max-width:520px;margin:40px auto}
.pg{display:flex;gap:8px;justify-content:center;margin:24px 0}.emp{text-align:center;color:var(--mut);padding:50px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:10px;border-bottom:1px solid var(--bd);text-align:left}.ov{overflow-x:auto}
footer{margin-top:60px;background:var(--card);border-top:1px solid var(--bd);padding:32px 0;color:var(--mut);font-size:14px}footer .w{display:flex;gap:20px;flex-wrap:wrap;justify-content:space-between}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;display:none;z-index:9}
#md{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:8;padding:20px}#md .card{max-width:560px;width:100%}
.sp{border:3px solid var(--bd);border-top-color:var(--ac);border-radius:50%;width:28px;height:28px;margin:40px auto;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
.tabs{display:flex;gap:8px;margin:16px 0}

:root{--sh:0 10px 30px rgba(47,91,255,.10)}
body{background:radial-gradient(900px 400px at 85% -50px,rgba(47,91,255,.10),transparent),var(--bg)}
nav{background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.logo{letter-spacing:-.02em}.lk a{padding:6px 10px;border-radius:8px;transition:.2s}.lk a:hover{background:rgba(47,91,255,.10);color:var(--ac)}
.btn{background:linear-gradient(135deg,#2f5bff,#6a4bff);box-shadow:0 6px 16px rgba(47,91,255,.30);transition:transform .2s,box-shadow .2s;border-radius:12px}
.btn:hover{background:linear-gradient(135deg,#3f6aff,#7a5bff);transform:translateY(-1px);box-shadow:0 10px 22px rgba(47,91,255,.36)}
.btn.g{background:transparent;box-shadow:none}.btn.g:hover{background:rgba(47,91,255,.08);transform:none}.btn.r{background:var(--bad);box-shadow:none}.btn.k{background:var(--ok);box-shadow:none}
.hero{position:relative;overflow:hidden;padding:84px 0 92px;background:radial-gradient(600px 300px at 15% 10%,rgba(106,75,255,.55),transparent),radial-gradient(500px 300px at 90% 80%,rgba(47,180,255,.35),transparent),linear-gradient(135deg,#081230,#14307a 60%,#2f5bff)}
.hero:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.12) 1px,transparent 1px);background-size:26px 26px;mask-image:linear-gradient(#000,transparent 85%);-webkit-mask-image:linear-gradient(#000,transparent 85%)}
.hero .w{position:relative}.gt{background:linear-gradient(90deg,#9db4ff,#7ee0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{display:inline-block;margin-bottom:16px;font-size:13px;font-weight:600;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);order:-1}
.hero svg{filter:drop-shadow(0 24px 40px rgba(0,0,0,.35));animation:fl 6s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}
.stat,.card{border-radius:20px;box-shadow:var(--sh);transition:transform .25s,box-shadow .25s,border-color .25s}
.stat b{background:linear-gradient(135deg,var(--ac),#8a5bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.grid>.card:hover,a.card:hover{transform:translateY(-4px);border-color:rgba(47,91,255,.4);box-shadow:0 18px 40px rgba(47,91,255,.18)}
a.card b{font-size:18px;background:linear-gradient(135deg,var(--ac),#8a5bff);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-weight:800;letter-spacing:-.02em}h2:not(.form h2):before{content:"";display:inline-block;width:6px;height:22px;border-radius:4px;background:linear-gradient(var(--ac),#8a5bff);margin-right:10px;vertical-align:-3px}
.tag{background:linear-gradient(135deg,rgba(47,91,255,.14),rgba(138,91,255,.14));border-radius:99px;padding:3px 10px}
input,select,textarea{border-radius:12px;transition:border-color .2s,box-shadow .2s}input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 4px rgba(47,91,255,.15)}
.big{border-radius:16px;box-shadow:var(--sh)}footer{background:linear-gradient(180deg,var(--card),var(--bg))}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<nav><div class="w nb"><a href="#/" class="logo"><svg width="30" height="30" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#2f5bff"/><path d="M16 7 4 13l12 6 9-4.5V21h2v-8zM9 17v4c0 2 3.5 4 7 4s7-2 7-4v-4l-7 3.5z" fill="#fff"/></svg>Notes Hub</a>
<button id="ham" aria-label="Menu">☰</button><div class="lk" id="lk"></div></div></nav>
<div id="hero"></div><main id="app" class="w"></main>
<footer><div class="w"><div><b>Notes Hub</b><br>Your College. Your Resources. One Place.</div><div>About · Contact · Privacy Policy · Terms · Twitter · Instagram · GitHub</div></div></footer>
<div id="toast" role="status"></div><div id="md"><div class="card" id="mdc"></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mem={};const K='nh1';
const ld=()=>{try{return JSON.parse(localStorage.getItem(K))}catch(e){return mem.d}},sv=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){mem.d=D}};
const COL=['KIET Group of Institutions','IIT Delhi','Delhi Technological University','Sample Institute of Technology'],BR=['CSE','ECE','ME'],TYPES=['Notes','PYQ','Assignment','Lab Manual','Syllabus','Study Material','Question Bank','Other'],EX=['Mid Semester','End Semester','Internal','Back Paper','Other'],SES=['2025-26','2024-25','2023-24'];
const SUB={1:['calculus for engineers','Programming for Problem Solving','Engineering Physics','Engineering Chemistry','Communication Skills','Digital Logic design'],2:['Mathematics II','Data Structures Basics','Basic Electrical Engineering','Environmental Science'],3:['Data Structures','Discrete Mathematics','Computer Organization'],4:['DBMS','Operating Systems','Design & Analysis of Algorithms'],5:['Computer Networks','Theory of Computation','Software Engineering'],6:['Compiler Design','Machine Learning','Web Technologies'],7:['Cloud Computing','Information Security'],8:['Big Data Analytics','Project Work']};
const NM=['Aarav S.','Priya K.','Rohan M.','Sneha T.','Vikram P.'],TOP=['Introduction','Core Concepts','Problem Solving','Revision Notes','Important Questions'];
function seed(){let id=1,rs=[];const add=(br,sem,sub,type,i)=>{const yr=Math.ceil(sem/2),ft=i%3?'PDF':'PPTX';rs.push({id:id++,title:type==='PYQ'?`${sub} ${EX[i%4]} Paper ${SES[i%3]}`:`${sub} ${type} – ${TOP[i%5]}`,subject:sub,branch:br,college:COL[i%4],sem,year:yr,type,session:SES[i%3],exam:type==='PYQ'?EX[i%4]:'',unit:'Unit '+(i%5+1),topic:TOP[i%5],by:NM[i%5],date:`2026-0${1+i%8}-1${i%9}`,ft,size:(0.4+i%7*.6).toFixed(1)+' MB',desc:`Sample ${type.toLowerCase()} for ${sub}, ${br} semester ${sem}. Demo content for showcasing Notes Hub.`,tags:[sub.toLowerCase(),type.toLowerCase(),br.toLowerCase()],status:'Approved',demo:1,owner:'seed'})};
Object.entries(SUB).forEach(([s,l])=>l.forEach((sub,j)=>BR.forEach((br,b)=>{if(b&&s>2)return;['Notes','PYQ','PYQ','Assignment','Lab Manual','Syllabus'].forEach((t,k)=>add(br,+s,sub,t,j+k+b))})));
return{users:[{id:1,name:'Admin',email:'admin@noteshub.dev',pw:btoa('admin123'),college:COL[0],branch:'CSE',year:4,sem:8,role:'admin'}],resources:rs,bm:{},reports:[],viewed:{},me:null,nid:id}}
let D=ld()||seed();sv();
const me=()=>D.users.find(u=>u.id===D.me),pub=()=>D.resources.filter(r=>r.status==='Approved');
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
function modal(h){$('#mdc').innerHTML=h;$('#md').style.display='flex'}function closeM(){$('#md').style.display='none'}
$('#md').onclick=e=>{if(e.target.id==='md')closeM()};
const opt=(a,v,all)=>(all?`<option value="">${all}</option>`:'')+a.map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join('');
const allSubs=()=>[...new Set(Object.values(SUB).flat())];
function nav(){const u=me();$('#lk').innerHTML=['','resources','pyqs','notes','subjects'].map(p=>`<a href="#/${p}">${p?p[0].toUpperCase()+p.slice(1):'Home'}</a>`).join('').replace('>Pyqs<','>PYQs<')+`<a href="#/about">About</a>`+(u?`<a href="#/dash">Dashboard</a>${u.role==='admin'?'<a href="#/admin">Admin</a>':''}<a href="#" data-a="out">Logout</a>`:`<a href="#/login">Login</a><a class="btn s" href="#/signup" style="color:#fff">Sign Up</a>`)}
const rank=(r,q)=>{const t=q.toLowerCase().split(/\s+/).filter(Boolean).map(w=>({maths:'mathematics',math:'mathematics',dbms:'dbms',papers:'pyq',paper:'pyq',ds:'data structures'}[w]||w));const hs=(r.title+' '+r.subject+' '+r.topic+' '+r.desc+' '+r.tags.join(' ')+' '+r.type+' '+r.session+' sem '+r.sem+' semester '+r.sem).toLowerCase();let s=0;for(const w of t){const parts=w.split(' ');if(!parts.every(p=>hs.includes(p)))return 0;s++}return s+1};
function card(r){const u=me(),sv=u&&(D.bm[u.id]||[]).includes(r.id);return`<div class="card"><span class="tag">${esc(r.type)}</span>${r.demo?'<span class="tag demo">Demo</span>':''}${u&&r.status!=='Approved'?`<span class="tag ${r.status}">${r.status}</span>`:''}<h3>${esc(r.title)}</h3><div class="m">${esc(r.subject)} · ${esc(r.branch)} · Sem ${r.sem} · ${esc(r.session)}${r.exam?' · '+esc(r.exam):''}</div><div class="m">By ${esc(r.by)} · ${esc(r.date)} · ${esc(r.ft)} · ${esc(r.size)}</div><div class="row"><a class="btn s" href="#/r/${r.id}">View</a><button class="btn s g" data-a="dl" data-id="${r.id}">Download</button><button class="btn s g" data-a="save" data-id="${r.id}">${sv?'★ Saved':'☆ Save'}</button></div></div>`}
const F={};
function list(type,title){const f=F[type||'x']=F[type||'x']||{q:'',br:'',sem:'',sub:'',ty:'',ses:'',pg:1,exam:''};window.cur=f;
return`<h2>${title}</h2><input class="big" id="q" list="sg" placeholder="Search notes, subjects, PYQs, topics..." value="${esc(f.q)}"><datalist id="sg">${allSubs().map(s=>`<option value="${esc(s)}">`).join('')}<option value="DBMS PYQ"><option value="Maths semester 1 notes"><option value="Data Structures 2025 paper"></datalist>
<div class="fl">${sel('br','Branch',BR,f)}${sel('sem','Semester',[1,2,3,4,5,6,7,8],f)}${sel('sub','Subject',allSubs(),f)}${type?'':sel('ty','Type',TYPES,f)}${type==='PYQ'?sel('exam','Exam Type',EX,f):''}${sel('ses','Session',SES,f)}</div><div id="res"></div>`}
const sel=(k,l,a,f)=>`<select data-f="${k}" aria-label="${l}">${opt(a,f[k],'All '+l+'s')}</select>`;
function fill(type){const f=window.cur,el=$('#res');let r=pub().filter(x=>(!type||x.type===type)&&(!f.br||x.branch===f.br)&&(!f.sem||x.sem==f.sem)&&(!f.sub||x.subject===f.sub)&&(!f.ty||x.type===f.ty)&&(!f.ses||x.session===f.ses)&&(!f.exam||x.exam===f.exam));
if(f.q)r=r.map(x=>[x,rank(x,f.q)]).filter(a=>a[1]).sort((a,b)=>b[1]-a[1]).map(a=>a[0]);const n=Math.ceil(r.length/9)||1;f.pg=Math.min(f.pg,n);
el.innerHTML=r.length?`<div class="m">${r.length} results</div><div class="grid">${r.slice((f.pg-1)*9,f.pg*9).map(card).join('')}</div><div class="pg"><button class="btn g s" data-a="pg" data-d="-1" ${f.pg<2?'disabled':''}>← Prev</button><span class="m">Page ${f.pg} / ${n}</span><button class="btn g s" data-a="pg" data-d="1" ${f.pg>=n?'disabled':''}>Next →</button></div>`:'<div class="emp">😕 No resources match. Try clearing filters.</div>'}
function home(){const p=pub();$('#hero').innerHTML=`<section class="hero"><div class="w"><div><h1>Everything You Need to Study, <span class="gt">In One Place.</span></h1><span class="pill">🎓 Now featuring KIET</span><p>Find notes, previous year papers, assignments and study resources organized for your college, branch and semester.</p><div class="row"><a class="btn" style="background:#fff;color:#0b1b3a" href="#/resources">Explore Resources</a><a class="btn g" style="color:#fff;border-color:#8fa6ff" href="#/pyqs">Browse PYQs</a></div></div><svg viewBox="0 0 300 220" aria-hidden="true"><rect x="40" y="60" width="150" height="110" rx="14" fill="#fff" opacity=".95"/><rect x="60" y="82" width="80" height="8" rx="4" fill="#2f5bff"/><rect x="60" y="102" width="110" height="6" rx="3" fill="#c7d3ff"/><rect x="60" y="118" width="95" height="6" rx="3" fill="#c7d3ff"/><rect x="130" y="30" width="130" height="100" rx="14" fill="#6a8bff"/><path d="m195 55-40 18 40 18 40-18zM170 88v14c0 8 12 14 25 14s25-6 25-14V88l-25 11z" fill="#fff"/></svg></div></section>`;return`<div class="stats"><div class="stat"><b>${p.filter(x=>x.type==='Notes').length}</b><span>Notes Available</span></div><div class="stat"><b>${p.filter(x=>x.type==='PYQ').length}</b><span>PYQs Available</span></div><div class="stat"><b>${allSubs().length}</b><span>Subjects</span></div><div class="stat"><b>${D.users.length}</b><span>Students</span></div></div>
<h2>Browse by Semester</h2><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))">${[1,2,3,4,5,6,7,8].map(s=>`<a class="card" href="#/subjects/${s}"><b>Semester ${s}</b><div class="m">${(SUB[s]||[]).length} subjects</div></a>`).join('')}</div>
<h2>Popular Resources</h2><div class="grid">${p.filter(x=>x.sem<4).slice(0,6).map(card).join('')}</div>
<h2>Why Notes Hub?</h2><div class="grid">${[['📚','Organized Resources','By college, branch, semester and subject.'],['🔎','Easy Search','Type "DBMS PYQ" and go.'],['📝','Previous Year Papers','Preview before you download.'],['🤝','Student Contributions','Seniors share, admins review.'],['📱','Mobile Friendly','Study anywhere.']].map(a=>`<div class="card"><div style="font-size:26px">${a[0]}</div><h3>${a[1]}</h3><div class="m">${a[2]}</div></div>`).join('')}</div>`}
function subjects(s){const f=F.s=F.s||{c:COL[0],b:'CSE',y:1,s:1};if(s)f.s=+s;f.y=Math.ceil(f.s/2);window.cur=f;
return`<h2>Subjects</h2><div class="fl"><select data-g="c">${opt(COL,f.c)}</select><select data-g="b">${opt(BR,f.b)}</select><select data-g="s">${[1,2,3,4,5,6,7,8].map(n=>`<option value="${n}" ${n==f.s?'selected':''}>Semester ${n} (Year ${Math.ceil(n/2)})</option>`).join('')}</select></div><div class="grid">${(f.b!=='CSE'&&f.s>2?[]:SUB[f.s]||[]).map(x=>`<a class="card" href="#/sub/${encodeURIComponent(x)}/${f.b}"><h3>${esc(x)}</h3><div class="m">${pub().filter(r=>r.subject===x&&r.branch===f.b).length} resources</div></a>`).join('')||'<div class="emp">No subjects for this selection yet.</div>'}</div>`}
function sub(n,b){const rs=pub().filter(r=>r.subject===n&&r.branch===b);return`<h2>${esc(n)} <span class="m">${b}</span></h2>${['Notes','PYQ','Assignment','Lab Manual','Syllabus'].map(t=>{const l=rs.filter(r=>r.type===t);return l.length?`<h3>${t}</h3><div class="grid">${l.map(card).join('')}</div>`:''}).join('')||'<div class="emp">Nothing here yet.</div>'}`}
function detail(id){const r=D.resources.find(x=>x.id==id),u=me();if(!r||(r.status!=='Approved'&&!(u&&(u.role==='admin'||u.id===r.owner))))return'<div class="emp">Resource not found.</div>';if(u){D.viewed[u.id]=[r.id,...(D.viewed[u.id]||[]).filter(x=>x!==r.id)].slice(0,6);sv()}
const rel=pub().filter(x=>x.subject===r.subject&&x.id!==r.id).slice(0,3);return`<h2>${esc(r.title)}</h2><div class="card"><span class="tag">${esc(r.type)}</span>${r.demo?'<span class="tag demo">Sample/Demo data</span>':''}<p>${esc(r.desc)}</p><div class="m">Subject: ${esc(r.subject)} · Branch: ${esc(r.branch)} · Semester ${r.sem} · Year ${r.year} · ${esc(r.session)}<br>Uploaded by ${esc(r.by)} on ${esc(r.date)} · ${esc(r.ft)} · ${esc(r.size)}</div><div class="row"><button class="btn" data-a="pv" data-id="${r.id}">Preview PDF</button><button class="btn g" data-a="dl" data-id="${r.id}">Download</button><button class="btn g" data-a="save" data-id="${r.id}">☆ Save Resource</button><button class="btn g" data-a="rep" data-id="${r.id}">⚑ Report</button></div></div><h2>Related Resources</h2><div class="grid">${rel.map(card).join('')||'<div class="emp">No related resources.</div>'}</div>`}
function auth(m){return`<div class="card form"><h2 style="margin-top:0">${m==='login'?'Welcome back':m==='signup'?'Create your account':'Reset password'}</h2><form id="af" data-m="${m}"><label>Email</label><input name="email" type="email" required>${m==='signup'?`<label>Name</label><input name="name" required minlength="2"><label>College</label><select name="college">${opt(COL)}</select><label>Branch</label><select name="branch">${opt(BR)}</select><label>Year</label><select name="year">${[1,2,3,4].map(n=>`<option>${n}</option>`).join('')}</select><label>Semester</label><select name="sem">${[1,2,3,4,5,6,7,8].map(n=>`<option>${n}</option>`).join('')}</select>`:''}<label>${m==='reset'?'New password':'Password'}</label><input name="pw" type="password" required minlength="6"><div class="row"><button class="btn">${m==='login'?'Log in':m==='signup'?'Sign up':'Reset'}</button></div></form><p class="m">${m==='login'?'<a href="#/signup">Create account</a> · <a href="#/reset">Forgot password?</a><br>Demo admin: admin@noteshub.dev / admin123':'<a href="#/login">Back to login</a>'}</p></div>`}
const mini=(t,ids)=>`<h2>${t}</h2><div class="grid">${ids.map(i=>D.resources.find(r=>r.id===i)).filter(Boolean).map(card).join('')||'<div class="emp">Nothing yet.</div>'}</div>`;
function dash(){const u=me();if(!u)return go('login');return`<h2>Welcome, ${esc(u.name)}</h2><div class="row"><a class="btn" href="#/resources">Search Resources</a><a class="btn g" href="#/pyqs">Browse PYQs</a><a class="btn g" href="#/upload">Upload Resource</a></div>${mini('Recently viewed',D.viewed[u.id]||[])}${mini('Saved resources',D.bm[u.id]||[])}${mini('My uploads',D.resources.filter(r=>r.owner===u.id).map(r=>r.id))}`}
function upload(){if(!me())return go('login');return`<div class="card form"><h2 style="margin-top:0">Upload Resource</h2><div class="tag Pending">Your resource will be reviewed before appearing publicly.</div><form id="uf"><label>Title</label><input name="title" required maxlength="120"><label>Description</label><textarea name="desc" rows="3" required></textarea><label>College</label><select name="college">${opt(COL)}</select><label>Branch</label><select name="branch">${opt(BR)}</select><label>Semester</label><select name="sem">${[1,2,3,4,5,6,7,8].map(n=>`<option>${n}</option>`).join('')}</select><label>Subject</label><select name="subject">${opt(allSubs())}</select><label>Resource Type</label><select name="type">${opt(TYPES)}</select><label>Academic Session</label><select name="session">${opt(SES)}</select><label>Unit / Topic</label><input name="topic" required><label>File (PDF, DOC, DOCX, PPT, PPTX, image · max 4 MB, stored in this browser)</label><input name="file" type="file" required accept=".pdf,.doc,.docx,.ppt,.pptx,image/*"><div class="row"><button class="btn">Submit for review</button></div></form></div>`}
function admin(){const u=me();if(!u||u.role!=='admin')return'<div class="emp">🔒 Admins only.</div>';const t=admin.t||'r';const T=`<div class="tabs">${[['r','Resources'],['u','Users'],['p','Reports']].map(a=>`<button class="btn s ${t===a[0]?'':'g'}" data-a="tab" data-id="${a[0]}">${a[1]}</button>`).join('')}</div>`;
if(t==='u')return`<h2>Admin</h2>${T}<div class="ov"><table><tr><th>Name</th><th>Email</th><th>College</th><th>Role</th></tr>${D.users.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${esc(x.college)}</td><td>${x.role}</td></tr>`).join('')}</table></div>`;
if(t==='p')return`<h2>Admin</h2>${T}<div class="ov"><table><tr><th>Resource</th><th>Reason</th><th>By</th><th></th></tr>${D.reports.map((x,i)=>`<tr><td>${esc((D.resources.find(r=>r.id===x.rid)||{}).title||'(deleted)')}</td><td>${esc(x.reason)}</td><td>${esc(x.by)}</td><td><button class="btn s g" data-a="dis" data-id="${i}">Dismiss</button> <button class="btn s r" data-a="del" data-id="${x.rid}">Delete resource</button></td></tr>`).join('')||'<tr><td colspan=4 class="emp">No reports.</td></tr>'}</table></div>`;
const rs=[...D.resources].sort((a,b)=>(a.status==='Pending'?0:1)-(b.status==='Pending'?0:1)).slice(0,40);return`<h2>Admin</h2>${T}<div class="ov"><table><tr><th>Title</th><th>Type</th><th>Status</th><th>Actions</th></tr>${rs.map(r=>`<tr><td>${esc(r.title)}</td><td>${r.type}</td><td><span class="tag ${r.status}">${r.status}</span></td><td>${r.status!=='Approved'?`<button class="btn s k" data-a="ap" data-id="${r.id}">Approve</button> `:''}${r.status==='Pending'?`<button class="btn s g" data-a="rj" data-id="${r.id}">Reject</button> `:''}<button class="btn s g" data-a="ed" data-id="${r.id}">Edit</button> <button class="btn s r" data-a="del" data-id="${r.id}">Delete</button></td></tr>`).join('')}</table></div><p class="m">Showing first 40. Manage colleges, branches and subjects in the full backend version.</p>`}
function go(p){location.hash='#/'+p;return''}
function route(){nav();$('#lk').classList.remove('o');const[,p,a,b]=(location.hash||'#/').split('/'),app=$('#app');let h='';
try{if(!p)h=home();else if(p==='resources'){h=list('', 'Resources');}else if(p==='pyqs')h=list('PYQ','Previous Year Papers');else if(p==='notes')h=list('Notes','Notes');else if(p==='subjects')h=subjects(a);else if(p==='sub')h=sub(decodeURIComponent(a),b);else if(p==='r')h=detail(a);else if(['login','signup','reset'].includes(p))h=auth(p);else if(p==='dash')h=dash();else if(p==='upload')h=upload();else if(p==='admin')h=admin();else if(p==='about')h='<h2>About Notes Hub</h2><p>Notes Hub is a student-run library of notes, PYQs and study material. Your College. Your Resources. One Place.</p>';else h='<div class="emp">Page not found.</div>'}catch(e){h='<div class="emp">Something went wrong. <a href="#/">Go home</a></div>'}
if(p)$('#hero').innerHTML='';app.innerHTML=h;
window.type=p==='pyqs'?'PYQ':p==='notes'?'Notes':'';if(['resources','pyqs','notes'].includes(p))fill(type);scrollTo(0,0)}
addEventListener('hashchange',route);$('#ham').onclick=()=>$('#lk').classList.toggle('o');
document.addEventListener('input',e=>{if(e.target.id==='q'){window.cur.q=e.target.value;window.cur.pg=1;fill(type)}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.f){cur[t.dataset.f]=t.value;cur.pg=1;fill(type)}if(t.dataset.g){cur[t.dataset.g]=t.value;route()}});
function dlFile(r){if(r.dataUrl){const a=document.createElement('a');a.href=r.dataUrl;a.download=r.title.replace(/[^\w]+/g,'_')+'.'+(r.ft||'pdf').toLowerCase();document.body.appendChild(a);a.click();a.remove();return}
const d=`Notes Hub sample file\n${r.title}\n${r.desc}\n`,n=r.title.replace(/[^\w]+/g,'_')+'.txt';(window.claude?claude.use('downloads'):Promise.resolve(null)).then(x=>x?x.save({filename:n,data:d}).catch(()=>toast('Download cancelled')):toast('Downloads unavailable here'));}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,id=+t.dataset.id,u=me(),r=D.resources.find(x=>x.id===id);
if(a==='out'){e.preventDefault();D.me=null;sv();toast('Logged out');return go('')}
if(a==='pg'){cur.pg+=+t.dataset.d;fill(type)}
if(a==='dl')dlFile(r);
if(a==='pv'){const body=r.dataUrl?(r.ft==='PDF'?`<iframe src="${r.dataUrl}" style="width:100%;height:65vh;border:1px solid var(--bd);border-radius:12px"></iframe>`:`<img src="${r.dataUrl}" style="max-width:100%;max-height:65vh;border-radius:12px">`):`<div style="height:260px;border:1px dashed var(--bd);border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center" class="m">PDF preview placeholder<br>(demo file, no real document)</div>`;modal(`<h3>${esc(r.title)}</h3>${body}<div class="row"><button class="btn" onclick="closeM()">Close</button></div>`)}
if(a==='save'){if(!u){toast('Log in to save resources');return go('login')}const l=D.bm[u.id]=D.bm[u.id]||[];const i=l.indexOf(id);i<0?l.push(id):l.splice(i,1);sv();toast(i<0?'Saved':'Removed from saved');route()}
if(a==='rep'){if(!u){toast('Log in to report');return go('login')}modal(`<h3>Report resource</h3><select id="rr">${opt(['Wrong content','Duplicate resource','Copyright issue','Incorrect subject','Inappropriate content','Other'])}</select><div class="row"><button class="btn" data-a="rsend" data-id="${id}">Submit</button><button class="btn g" onclick="closeM()">Cancel</button></div>`)}
if(a==='rsend'){D.reports.push({rid:id,reason:$('#rr').value,by:u.email});sv();closeM();toast('Report sent to admins')}
if(u&&u.role==='admin'){if(a==='tab'){admin.t=t.dataset.id;route()}
if(a==='ap'||a==='rj'){r.status=a==='ap'?'Approved':'Rejected';sv();toast(r.status);route()}
if(a==='del'&&confirm('Delete this resource permanently?')){D.resources=D.resources.filter(x=>x.id!==id);D.reports=D.reports.filter(x=>x.rid!==id);sv();toast('Deleted');route()}
if(a==='dis'){D.reports.splice(id,1);sv();route()}
if(a==='ed'){const n=prompt('New title',r.title);if(n&&n.trim()){r.title=n.trim().slice(0,120);sv();route()}}}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f));
if(f.id==='af'){const m=f.dataset.m,em=d.email.trim().toLowerCase(),x=D.users.find(u=>u.email===em);
if(m==='signup'){if(x)return toast('Email already registered');const n={id:Date.now(),name:d.name.trim(),email:em,pw:btoa(d.pw),college:d.college,branch:d.branch,year:+d.year,sem:+d.sem,role:'student'};D.users.push(n);D.me=n.id;sv();toast('Welcome to Notes Hub!');go('dash')}
if(m==='login'){if(!x||x.pw!==btoa(d.pw))return toast('Wrong email or password');D.me=x.id;sv();toast('Logged in');go(x.role==='admin'?'admin':'dash')}
if(m==='reset'){if(!x)return toast('No account with that email');x.pw=btoa(d.pw);sv();toast('Password updated');go('login')}}
if(f.id==='uf'){const fl=d.file,ok=/\.(pdf|docx?|pptx?|png|jpe?g|gif|webp)$/i.test(fl.name);if(!ok)return toast('File type not allowed');if(fl.size>4*1048576)return toast('File exceeds 4 MB (browser storage limit)');const u=me();
const rd=new FileReader();rd.onload=()=>{D.resources.push({id:D.nid++,title:d.title.trim(),subject:d.subject,branch:d.branch,college:d.college,sem:+d.sem,year:Math.ceil(d.sem/2),type:d.type,session:d.session,exam:'',unit:'',topic:d.topic,by:u.name,date:new Date().toISOString().slice(0,10),ft:fl.name.split('.').pop().toUpperCase(),size:(fl.size/1048576).toFixed(1)+' MB',desc:d.desc.trim(),tags:[d.subject.toLowerCase(),d.type.toLowerCase()],status:'Pending',owner:u.id,dataUrl:rd.result});try{sv();toast('Submitted for review');go('dash')}catch(err){D.resources.pop();toast('Storage full — try a smaller file or fewer uploads')}};
rd.onerror=()=>toast('Could not read file');rd.readAsDataURL(fl)}});
route();
</script></body></html>
